name: Tests

on:
  push:
  pull_request:

jobs:
  selenium-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Selenium tests (headless Chrome)
        working-directory: selenium-java-demo
        run: mvn -B test -Dheadless=true

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-surefire-reports
          path: selenium-java-demo/target/surefire-reports

  playwright-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: playwright-ts-demo
        run: npm install

      - name: Install Chromium
        working-directory: playwright-ts-demo
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: playwright-ts-demo
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-ts-demo/playwright-report
